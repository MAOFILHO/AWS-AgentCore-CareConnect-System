# Deterministic gates. Run on every PR; a human checks them before merging. Cannot be prompt-injected.
name: factory-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  security-events: write
jobs:
  checks:
    name: tests-typecheck-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
      - run: npm test
      - run: python3 -m pip install -r requirements.txt
      - run: PYTHONPATH=src python3 -m unittest discover -s test
      - run: npm run typecheck --if-present
      - run: npm run lint --if-present
      - run: npm run build --if-present
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: semgrep scan --config auto --config .semgrep.yml --error
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
