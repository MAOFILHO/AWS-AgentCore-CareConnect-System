<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareConnect</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <header>
    <h1>CareConnect</h1>
    <p class="sub-line">Riverside Health</p>
  </header>
  <form id="chat-form">
    <label for="question">Your question</label>
    <textarea id="question" name="question" rows="4" autocomplete="off" required></textarea>
    <button type="submit">Ask</button>
  </form>
  <div id="reply" role="region" aria-label="Answer" aria-live="polite"></div>
  <script src="config.js"></script>
  <script type="module" src="chat.js"></script>
</body>
</html>
